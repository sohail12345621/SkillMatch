# ===== Production Configuration =====
server.port=${PORT:8080}

# ===== Database (Railway / Aiven / Render MySQL) =====
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skillmatch_db}?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:SkillMatchSecretKey2024SuperSecureRandomStringThatIsLongEnoughForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/profile-pictures}

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://skillmatch.vercel.app}
