# ===== Production Configuration =====
server.port=${PORT:8080}

# ===== Database (MySQL with H2 fallback) =====
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:skillmatch_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:SkillMatchSecretKey2024SuperSecureRandomStringThatIsLongEnoughForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/profile-pictures}

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://skillmatch-frontend-theta.vercel.app,http://localhost:5173}
