# ===== Server =====
server.port=8080

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/skillmatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=SkillMatchSecretKey2024SuperSecureRandomStringThatIsLongEnoughForHS256Algorithm
app.jwt.expiration-ms=86400000

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-pictures

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173
